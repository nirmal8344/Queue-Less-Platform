spring.application.name=queueless

# Database Configuration (override via environment variables in production)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/queueless}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# JWT Configuration
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Seed Account Passwords (must be set via SEED_ADMIN_PASSWORD / SEED_STAFF_PASSWORD env vars)
seed.admin.password=${SEED_ADMIN_PASSWORD:}
seed.staff.password=${SEED_STAFF_PASSWORD:}